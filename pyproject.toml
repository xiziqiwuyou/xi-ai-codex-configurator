[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xi-ai-codex-configurator"
version = "0.1.0"
description = "Safely configure Codex to use Xi-AI through the Responses API."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
xi-ai-codex = "codex_configurator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
