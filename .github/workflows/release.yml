name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify release sources
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v
          python -m compileall src scripts tests
      - name: Build release assets
        run: python scripts/package_release.py --version "$GITHUB_REF_NAME" --output dist
      - name: Install FTPS client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp
      - name: Publish immutable version over FTPS
        env:
          FTPS_HOST: ${{ secrets.FTPS_HOST }}
          FTPS_PORT: ${{ secrets.FTPS_PORT }}
          FTPS_USERNAME: ${{ secrets.FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
        run: |
          set -euo pipefail
          for name in FTPS_HOST FTPS_PORT FTPS_USERNAME FTPS_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Secret: $name" >&2
              exit 1
            fi
          done

          assets=(
            xi-ai-codex-bundle.zip
            xi-ai-codex-bundle.zip.sha256
            xi-ai-codex-bootstrap.py
            xi-ai-codex-bootstrap.py.sha256
            xi-ai-codex-release.json
          )
          if [ "$(find dist -maxdepth 1 -type f | wc -l)" -ne "${#assets[@]}" ]; then
            echo "dist must contain exactly the five fixed release assets" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            test -f "dist/$asset"
          done
          if [[ ! "$GITHUB_REF_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || \
             [[ "$GITHUB_REF_NAME" == "latest" ]]; then
            echo "Release tag is not safe for the publish path" >&2
            exit 1
          fi

          remote_root=/xi-ai-codex
          remote_version="$remote_root/$GITHUB_REF_NAME"
          staging_name="_staging-$GITHUB_REF_NAME-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          staging_version="$remote_root/$staging_name"
          ftps() {
            LFTP_PASSWORD="$FTPS_PASSWORD" lftp --env-password \
              --user "$FTPS_USERNAME" -p "$FTPS_PORT" "$@" "ftp://$FTPS_HOST"
          }
          ftps <<LFTP
          set cmd:fail-exit yes
          set ftp:passive-mode true
          set ftp:ssl-auth TLS
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          # The website root is provisioned by the FTP administrator. Verify
          # it exists instead of treating an existing directory as a failure.
          cd $remote_root
          bye
          LFTP

          if ftps \
            -e "set cmd:fail-exit yes; set ftp:passive-mode true; set ftp:ssl-auth TLS; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:ssl-protect-list true; set ssl:verify-certificate yes; set ssl:check-hostname yes; cls -d $remote_version; bye" \
            >/dev/null 2>&1; then
            echo "Release version already exists and is immutable: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          ftps <<LFTP
          set cmd:fail-exit yes
          set ftp:passive-mode true
          set ftp:ssl-auth TLS
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          mkdir $staging_version
          put dist/xi-ai-codex-bundle.zip -o $staging_version/xi-ai-codex-bundle.zip
          put dist/xi-ai-codex-bundle.zip.sha256 -o $staging_version/xi-ai-codex-bundle.zip.sha256
          put dist/xi-ai-codex-bootstrap.py -o $staging_version/xi-ai-codex-bootstrap.py
          put dist/xi-ai-codex-bootstrap.py.sha256 -o $staging_version/xi-ai-codex-bootstrap.py.sha256
          put dist/xi-ai-codex-release.json -o $staging_version/xi-ai-codex-release.json
          bye
          LFTP

          mkdir verify
          for asset in "${assets[@]}"; do
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --max-redirs 0 --retry 5 --retry-all-errors --retry-delay 2 \
              -H 'Cache-Control: no-cache' \
              "https://download.xi-ai.net/xi-ai-codex/$staging_name/$asset" \
              --output "verify/published-$asset"
            cmp --silent "dist/$asset" "verify/published-$asset"
          done

          ftps <<LFTP
          set cmd:fail-exit yes
          set ftp:passive-mode true
          set ftp:ssl-auth TLS
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          mv $staging_version $remote_version
          bye
          LFTP

          for asset in "${assets[@]}"; do
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --max-redirs 0 --retry 5 --retry-all-errors --retry-delay 2 \
              -H 'Cache-Control: no-cache' \
              "https://download.xi-ai.net/xi-ai-codex/$GITHUB_REF_NAME/$asset" \
              --output "verify/final-$asset"
            cmp --silent "dist/$asset" "verify/final-$asset"
          done

          mkdir pointer
          python -c 'import json, os, pathlib; pathlib.Path("pointer/latest.json").write_text(json.dumps({"schema_version": 1, "version": os.environ["GITHUB_REF_NAME"]}, indent=2) + "\n", encoding="utf-8")'
          latest_temp="latest.json.tmp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ftps <<LFTP
          set cmd:fail-exit yes
          set ftp:passive-mode true
          set ftp:ssl-auth TLS
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          put pointer/latest.json -o $remote_root/$latest_temp
          bye
          LFTP

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --max-redirs 0 --retry 5 --retry-all-errors --retry-delay 2 \
            -H 'Cache-Control: no-cache' \
            "https://download.xi-ai.net/xi-ai-codex/$latest_temp" \
            --output verify/latest.json
          cmp --silent pointer/latest.json verify/latest.json

          ftps <<LFTP
          set cmd:fail-exit yes
          set ftp:passive-mode true
          set ftp:ssl-auth TLS
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          # Pure-FTPd implements RNTO with same-filesystem rename(2), which
          # atomically replaces an existing regular latest.json. Never delete
          # the old pointer first; a failed rename must leave it intact.
          mv $remote_root/$latest_temp $remote_root/latest.json
          bye
          LFTP

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --max-redirs 0 --retry 5 --retry-all-errors --retry-delay 2 \
            -H 'Cache-Control: no-cache' \
            https://download.xi-ai.net/xi-ai-codex/latest.json \
            --output verify/published-latest.json
          cmp --silent pointer/latest.json verify/published-latest.json
