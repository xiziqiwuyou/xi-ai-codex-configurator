name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify release sources
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v
          python -m compileall src scripts tests
      - name: Build release assets
        run: python scripts/package_release.py --version "$GITHUB_REF_NAME" --output dist
      - name: Publish immutable version over FTPS
        timeout-minutes: 10
        env:
          FTPS_HOST: ${{ secrets.FTPS_HOST }}
          FTPS_PORT: ${{ secrets.FTPS_PORT }}
          FTPS_USERNAME: ${{ secrets.FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
        run: |
          set -euo pipefail
          python scripts/publish_release.py --version "$GITHUB_REF_NAME" --dist dist
